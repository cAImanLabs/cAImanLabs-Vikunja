name: Bug Report
description: Found something you weren't expecting? Report it here!
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        NOTE: If your issue is a security concern, please open a private security advisory instead of a public issue.
  - type: markdown
    attributes:
      value: |
        Please fill out this issue template to report a bug.

        1. If you want to propose a new feature, please use the Feature template or open a discussion thread.
        2. Make sure you are using the latest release and
           take a moment to check that your issue hasn't been reported before.
        3. Please give all relevant information below for bug reports, because
           incomplete details will be handled as an invalid report and closed.
  - type: checkboxes
    id: searched
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched for existing open or closed issue reports with the same problem.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Please provide a description of your issue here, with a URL if you were able to reproduce the issue (see below).
  - type: input
    id: version
    attributes:
      label: cAImanDesk Version
      description: cAImanDesk version (or commit reference) of your instance
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser and version
      description: If your issue is related to a frontend problem, please provide the browser and version you used to reproduce it.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If this issue involves the Web Interface, please provide one or more screenshots
